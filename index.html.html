<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Cost Calculator</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0">
<div id="root"></div>

<script type="text/babel">
const { useState } = React;



// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────

const TYPES = [
  { id: 1, label: "Type 1", route: "Lagos → Singapore → Bali", flag: "🇳🇬", origin: "LOS", viaSG: true, city: "Lagos" },
  { id: 2, label: "Type 2", route: "Abuja → Singapore → Bali", flag: "🇳🇬", origin: "ABV", viaSG: true, city: "Abuja" },
  { id: 3, label: "Type 3", route: "Houston → Singapore → Bali", flag: "🇺🇸", origin: "IAH", viaSG: true, city: "Houston" },
  { id: 4, label: "Type 4", route: "Lagos → Bali (Direct)", flag: "🇳🇬", origin: "LOS", viaSG: false, city: "Lagos" },
  { id: 5, label: "Type 5", route: "Houston → Bali (Direct)", flag: "🇺🇸", origin: "IAH", viaSG: false, city: "Houston" },
];

const FLIGHTS_TO_SG = {
  LOS: [
    { airline: "Ethiopian Airlines", econ: 1150, biz: 3400 },
    { airline: "Qatar Airlines", econ: 1320, biz: 4850 },
    { airline: "Turkish Airlines", econ: 1280, biz: 4500 },
    { airline: "Emirates Airlines", econ: 1450, biz: 5200 },
  ],
  ABV: [
    { airline: "Ethiopian Airlines", econ: 1041.25, biz: 3808 },
    { airline: "Qatar Airlines", econ: 1011.5, biz: 4581.5 },
    { airline: "Turkish Airlines", econ: 1059.1, biz: 4046 },
    { airline: "Emirates Airlines", econ: 1279.25, biz: 5355 },
  ],
  IAH: [
    { airline: "Ethiopian Airlines", econ: 1650, biz: 5000, est: true },
    { airline: "Qatar Airways", econ: 1500, biz: 5200, est: true },
    { airline: "Turkish Airlines", econ: 1380, biz: 4800, est: true },
    { airline: "Emirates Airlines", econ: 1700, biz: 6200, est: true },
  ],
};

const FLIGHTS_SG_BAL = [
  { airline: "Singapore Airlines", econ: 350, biz: 900 },
  { airline: "Garuda Indonesia", econ: 330, biz: 800 },
  { airline: "KLM", econ: 280, biz: 390 },
];

const FLIGHTS_DIRECT_BAL = {
  LOS: [
    { airline: "Ethiopian Airlines", econ: 902, biz: 3850 },
    { airline: "Qatar Airlines", econ: 1082.4, biz: 4620 },
    { airline: "Turkish Airlines", econ: 935, biz: 4180 },
    { airline: "Emirates Airlines", econ: 1210, biz: 5500 },
  ],
  IAH: [
    { airline: "Qatar Airlines", econ: 1350, biz: 5850 },
    { airline: "Turkish Airlines", econ: 1550, biz: 5500 },
    { airline: "Emirates Airlines", econ: 1720, biz: 6570 },
  ],
};

const HOTELS = {
  singapore: [
    { name: "Oasia Hotel Downtown", single: 1447, dbl: 724 },
    { name: "Shangri-La Hotel", single: 1723, dbl: 877 },
    { name: "Park Royal Collection, Pickering", single: 1875, dbl: 938 },
  ],
  ubud: [
    { name: "Villa Orenda", single: 690, dbl: 345 },
    { name: "Tana & Anka 10BR Villa", single: 850, dbl: 425 },
  ],
  seminyak: [
    { name: "Alila, Seminyak", single: 1250, dbl: 625 },
    { name: "The Seminyak Beach Resort", single: 1250, dbl: 625 },
    { name: "W Hotel Seminyak", single: 1750, dbl: 875 },
  ],
};

const ACT = { singapore: 368, ubud: 225, seminyak: 446 };
const SG_TX = { airport: 56, daily: 108 }; // per person

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────

const fmt = (n) => n != null ? `$${Math.round(n).toLocaleString()}` : "–";

const initSel = () => ({ f1: 0, f1c: "econ", f2: 0, f2c: "econ", sgH: 0, ubH: 0, seH: 0 });

// ─────────────────────────────────────────────
// SUB-COMPONENTS
// ─────────────────────────────────────────────

const ClassPill = ({ val, onChange }) => (
  <div style={{ display: "flex", background: "#f0ede8", borderRadius: 8, padding: 3, gap: 2 }}>
    {["econ", "biz"].map(c => (
      <button
        key={c}
        onClick={() => onChange(c)}
        style={{
          padding: "5px 14px",
          borderRadius: 6,
          border: "none",
          cursor: "pointer",
          fontSize: 12,
          fontWeight: 600,
          letterSpacing: "0.03em",
          transition: "all 0.15s",
          background: val === c ? "#1a1714" : "transparent",
          color: val === c ? "#fff" : "#7a7065",
        }}
      >
        {c === "econ" ? "Economy" : "Business"}
      </button>
    ))}
  </div>
);

const AirlineButton = ({ airline, selected, estimated, onClick }) => (
  <button
    onClick={onClick}
    style={{
      padding: "7px 13px",
      borderRadius: 8,
      border: selected ? "2px solid #c96a2a" : "1.5px solid #e0d9cf",
      background: selected ? "#fdf2ea" : "#fff",
      color: selected ? "#c96a2a" : "#4a4540",
      fontWeight: selected ? 700 : 500,
      fontSize: 12,
      cursor: "pointer",
      transition: "all 0.15s",
      display: "flex",
      alignItems: "center",
      gap: 5,
      flexShrink: 0,
    }}
  >
    {airline}
    {estimated && (
      <span style={{
        background: "#fef3c7",
        color: "#b45309",
        fontSize: 9,
        fontWeight: 700,
        padding: "1px 5px",
        borderRadius: 4,
        letterSpacing: "0.04em",
      }}>EST</span>
    )}
  </button>
);

const HotelCard = ({ name, single, dbl, selected, onClick }) => (
  <button
    onClick={onClick}
    style={{
      width: "100%",
      display: "flex",
      alignItems: "center",
      justifyContent: "space-between",
      padding: "11px 14px",
      borderRadius: 10,
      border: selected ? "2px solid #c96a2a" : "1.5px solid #e0d9cf",
      background: selected ? "#fdf2ea" : "#fff",
      cursor: "pointer",
      transition: "all 0.15s",
      textAlign: "left",
      marginBottom: 6,
    }}
  >
    <span style={{ fontSize: 13, fontWeight: selected ? 700 : 500, color: selected ? "#c96a2a" : "#2a2520" }}>
      {name}
    </span>
    <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 10 }}>
      <span style={{ fontSize: 12, color: "#7a7065" }}>
        {fmt(single)} <span style={{ color: "#c0b8ad" }}>·</span> {fmt(dbl)}<span style={{ fontSize: 10, color: "#a09890" }}>/pp</span>
      </span>
    </div>
  </button>
);

const TransportInput = ({ label, value, onChange, pending }) => (
  <div style={{ flex: 1, minWidth: 110 }}>
    <div style={{ fontSize: 11, color: "#9a9088", fontWeight: 600, marginBottom: 5, letterSpacing: "0.04em" }}>
      {label}
    </div>
    <div style={{
      display: "flex",
      alignItems: "center",
      border: pending ? "1.5px dashed #f59e0b" : "1.5px solid #e0d9cf",
      borderRadius: 8,
      padding: "7px 10px",
      background: pending ? "#fffbeb" : "#fff",
    }}>
      <span style={{ color: "#9a9088", fontSize: 13, marginRight: 3 }}>$</span>
      <input
        type="number"
        value={value}
        onChange={e => onChange(e.target.value)}
        placeholder="pending"
        style={{
          border: "none",
          background: "transparent",
          outline: "none",
          width: "100%",
          fontSize: 13,
          fontWeight: 600,
          color: "#2a2520",
          fontFamily: "inherit",
        }}
      />
    </div>
  </div>
);

// ─────────────────────────────────────────────
// MAIN COMPONENT
// ─────────────────────────────────────────────

function TripCostCalculator() {
  const [activeType, setActiveType] = useState(1);
  const [selections, setSelections] = useState(
    Object.fromEntries(TYPES.map(t => [t.id, initSel()]))
  );
  const [bAirport, setBAirport] = useState("");
  const [bDaily, setBDaily] = useState("");
  const [bIntercity, setBIntercity] = useState("");

  const curType = TYPES.find(t => t.id === activeType);
  const sel = selections[activeType];
  const upd = (k, v) => setSelections(p => ({ ...p, [activeType]: { ...p[activeType], [k]: v } }));

  const f1Opts = curType.viaSG ? FLIGHTS_TO_SG[curType.origin] : FLIGHTS_DIRECT_BAL[curType.origin];
  const f1 = f1Opts[sel.f1];
  const f1Price = f1 ? (f1[sel.f1c] ?? 0) : 0;
  const f2 = FLIGHTS_SG_BAL[sel.f2];
  const f2Price = f2[sel.f2c];

  const sgH = HOTELS.singapore[sel.sgH];
  const ubH = HOTELS.ubud[sel.ubH];
  const seH = HOTELS.seminyak[sel.seH];

  const bApt = bAirport !== "" ? parseFloat(bAirport) : null;
  const bDly = bDaily !== "" ? parseFloat(bDaily) : null;
  const bIC = bIntercity !== "" ? parseFloat(bIntercity) : null;
  const baliPending = bApt === null || bDly === null || bIC === null;
  const hasEst = f1?.est;

  const calcTotal = (occ) => {
    const k = occ === "single" ? "single" : "dbl";
    let c = f1Price;
    if (curType.viaSG) c += f2Price;
    if (curType.viaSG) c += sgH[k];
    c += ubH[k] + seH[k];
    if (curType.viaSG) c += ACT.singapore;
    c += ACT.ubud + ACT.seminyak;
    if (curType.viaSG) c += SG_TX.airport + SG_TX.daily;
    if (bApt !== null) c += bApt;
    if (bDly !== null) c += bDly;
    if (bIC !== null) c += bIC;
    return c;
  };

  const singleTotal = calcTotal("single");
  const doubleTotal = calcTotal("double");

  // Breakdown rows
  const rows = [];
  rows.push({ label: curType.viaSG ? `✈ ${curType.city} → Singapore (round trip)` : `✈ ${curType.city} → Bali (round trip)`, amount: f1Price, est: hasEst });
  if (curType.viaSG) rows.push({ label: "✈ Singapore → Bali (round trip)", amount: f2Price });
  if (curType.viaSG) rows.push({ label: `🏨 Singapore – ${sgH.name}`, single: sgH.single, dbl: sgH.dbl });
  rows.push({ label: `🏡 Ubud – ${ubH.name}`, single: ubH.single, dbl: ubH.dbl });
  rows.push({ label: `🌊 Seminyak – ${seH.name}`, single: seH.single, dbl: seH.dbl });
  if (curType.viaSG) rows.push({ label: "🎡 Singapore activities", amount: ACT.singapore });
  rows.push({ label: "🌿 Ubud activities", amount: ACT.ubud });
  rows.push({ label: "🎉 Seminyak activities", amount: ACT.seminyak });
  if (curType.viaSG) rows.push({ label: "🚗 Singapore transport", amount: SG_TX.airport + SG_TX.daily });
  rows.push({ label: "🛬 Bali airport transfer", amount: bApt, pending: bApt === null });
  rows.push({ label: "🚐 Bali daily transport (10 days)", amount: bDly, pending: bDly === null });
  rows.push({ label: "🗺 Ubud → Seminyak transfer", amount: bIC, pending: bIC === null });

  return (
    <div style={{ fontFamily: "'DM Sans', 'Segoe UI', sans-serif", background: "#f7f3ee", minHeight: "100vh", padding: "0 0 60px" }}>

      {/* HEADER */}
      <div style={{ background: "#1a1714", padding: "28px 24px 22px", textAlign: "center" }}>
        <div style={{ fontSize: 10, letterSpacing: "0.18em", color: "#a09080", fontWeight: 700, textTransform: "uppercase", marginBottom: 8 }}>
          Birthday Celebration · Singapore & Bali
        </div>
        <div style={{ fontSize: 22, fontWeight: 800, color: "#fff", letterSpacing: "-0.02em", lineHeight: 1.2 }}>
          Trip Cost Calculator
        </div>
        <div style={{ fontSize: 12, color: "#7a6e65", marginTop: 6 }}>
          Per person · All flight, hotel & activity options from your cost sheet
        </div>
      </div>

      {/* GUEST TYPE TABS */}
      <div style={{ background: "#fff", borderBottom: "1px solid #e8e0d4", padding: "0 16px", overflowX: "auto" }}>
        <div style={{ display: "flex", gap: 0, minWidth: "max-content" }}>
          {TYPES.map(t => (
            <button
              key={t.id}
              onClick={() => setActiveType(t.id)}
              style={{
                padding: "14px 18px",
                border: "none",
                background: "transparent",
                cursor: "pointer",
                borderBottom: activeType === t.id ? "3px solid #c96a2a" : "3px solid transparent",
                transition: "all 0.15s",
              }}
            >
              <div style={{ fontSize: 13, fontWeight: 700, color: activeType === t.id ? "#c96a2a" : "#4a4540" }}>
                {t.flag} {t.label}
              </div>
              <div style={{ fontSize: 11, color: "#9a9088", marginTop: 2, whiteSpace: "nowrap" }}>
                {t.route}
              </div>
            </button>
          ))}
        </div>
      </div>

      {/* ESTIMATE NOTICE for Houston→SG */}
      {curType.viaSG && curType.origin === "IAH" && (
        <div style={{ background: "#fffbeb", borderBottom: "1px solid #fde68a", padding: "10px 20px", display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 16 }}>⚠️</span>
          <span style={{ fontSize: 12, color: "#92400e" }}>
            <strong>Houston → Singapore flight prices are estimates</strong> based on July 2026 market data. Please verify and confirm the actual fares before sharing with guests. All prices are flagged <span style={{ background: "#fef3c7", padding: "1px 5px", borderRadius: 4, fontWeight: 700, fontSize: 10 }}>EST</span>
          </span>
        </div>
      )}

      {/* MAIN LAYOUT */}
      <div style={{ maxWidth: 1000, margin: "0 auto", padding: "20px 16px", display: "grid", gridTemplateColumns: "1fr 340px", gap: 20, alignItems: "start" }}>

        {/* ─── LEFT: SELECTIONS ─── */}
        <div>

          {/* FLIGHTS */}
          <div style={{ background: "#fff", borderRadius: 14, border: "1px solid #e8e0d4", padding: "18px 20px", marginBottom: 14 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#9a9088", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 14 }}>
              Flight Options
            </div>

            {/* Flight 1 */}
            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#4a4540", marginBottom: 10 }}>
                {curType.viaSG
                  ? `${curType.city} → Singapore`
                  : `${curType.city} → Bali`}
                <span style={{ fontWeight: 400, color: "#9a9088", marginLeft: 6 }}>(round trip)</span>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 12 }}>
                {f1Opts.map((o, i) => (
                  <AirlineButton
                    key={i}
                    airline={o.airline}
                    selected={sel.f1 === i}
                    estimated={o.est}
                    onClick={() => upd("f1", i)}
                  />
                ))}
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <ClassPill val={sel.f1c} onChange={c => upd("f1c", c)} />
                <div style={{ textAlign: "right" }}>
                  <span style={{ fontSize: 20, fontWeight: 800, color: "#1a1714" }}>{fmt(f1Price)}</span>
                  {f1?.est && <div style={{ fontSize: 10, color: "#b45309", fontWeight: 600 }}>Estimated — pending your confirmation</div>}
                </div>
              </div>
            </div>

            {/* Flight 2 (via SG only) */}
            {curType.viaSG && (
              <div style={{ borderTop: "1px solid #f0ebe3", paddingTop: 18 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: "#4a4540", marginBottom: 10 }}>
                  Singapore → Bali
                  <span style={{ fontWeight: 400, color: "#9a9088", marginLeft: 6 }}>(round trip)</span>
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 12 }}>
                  {FLIGHTS_SG_BAL.map((o, i) => (
                    <AirlineButton
                      key={i}
                      airline={o.airline}
                      selected={sel.f2 === i}
                      onClick={() => upd("f2", i)}
                    />
                  ))}
                </div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <ClassPill val={sel.f2c} onChange={c => upd("f2c", c)} />
                  <span style={{ fontSize: 20, fontWeight: 800, color: "#1a1714" }}>{fmt(f2Price)}</span>
                </div>
              </div>
            )}
          </div>

          {/* HOTELS */}
          <div style={{ background: "#fff", borderRadius: 14, border: "1px solid #e8e0d4", padding: "18px 20px", marginBottom: 14 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#9a9088", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 16 }}>
              Accommodation · 5 Nights Each City
            </div>
            <div style={{ fontSize: 11, color: "#b0a89a", marginBottom: 10, textAlign: "right" }}>Price shown: Single · Per person sharing</div>

            {curType.viaSG && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: "#4a4540", marginBottom: 8 }}>🇸🇬 Singapore</div>
                {HOTELS.singapore.map((h, i) => (
                  <HotelCard key={i} {...h} selected={sel.sgH === i} onClick={() => upd("sgH", i)} />
                ))}
              </div>
            )}

            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#4a4540", marginBottom: 8 }}>🌿 Ubud, Bali</div>
              {HOTELS.ubud.map((h, i) => (
                <HotelCard key={i} {...h} selected={sel.ubH === i} onClick={() => upd("ubH", i)} />
              ))}
            </div>

            <div>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#4a4540", marginBottom: 8 }}>🌊 Seminyak, Bali</div>
              {HOTELS.seminyak.map((h, i) => (
                <HotelCard key={i} {...h} selected={sel.seH === i} onClick={() => upd("seH", i)} />
              ))}
            </div>
          </div>

          {/* BALI TRANSPORT */}
          <div style={{ background: "#fff", borderRadius: 14, border: "1.5px dashed #f59e0b", padding: "18px 20px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: "#9a9088", letterSpacing: "0.1em", textTransform: "uppercase" }}>
                🇮🇩 Bali Transport — Per Person
              </div>
              <span style={{ background: "#fef3c7", color: "#b45309", fontSize: 10, fontWeight: 700, padding: "3px 8px", borderRadius: 6, letterSpacing: "0.04em" }}>
                AWAITING YOUR FIGURES
              </span>
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <TransportInput label="Airport Transfer (return)" value={bAirport} onChange={setBAirport} pending={bApt === null} />
              <TransportInput label="Daily Transport (10 days total)" value={bDaily} onChange={setBDaily} pending={bDly === null} />
              <TransportInput label="Ubud → Seminyak Transfer" value={bIntercity} onChange={setBIntercity} pending={bIC === null} />
            </div>
            <div style={{ fontSize: 11, color: "#b0a89a", marginTop: 12 }}>
              Enter figures when available — totals update instantly. Singapore transport ($164/person) already included.
            </div>
          </div>
        </div>

        {/* ─── RIGHT: COST SUMMARY ─── */}
        <div style={{ position: "sticky", top: 16 }}>

          {/* Total Cost Card */}
          <div style={{ background: "#1a1714", borderRadius: 16, padding: "22px 22px", marginBottom: 14, overflow: "hidden", position: "relative" }}>
            <div style={{ position: "absolute", top: -30, right: -30, width: 120, height: 120, borderRadius: "50%", background: "rgba(201, 106, 42, 0.12)" }} />
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.14em", color: "#7a6e65", textTransform: "uppercase", marginBottom: 18 }}>
              Total Cost Per Person
            </div>

            {/* Double */}
            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 11, color: "#7a6e65", marginBottom: 4 }}>
                Double Occupancy <span style={{ color: "#5a5048" }}>(sharing a room)</span>
              </div>
              <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                <span style={{ fontSize: 36, fontWeight: 900, color: "#fff", letterSpacing: "-0.02em" }}>
                  {fmt(doubleTotal)}
                </span>
                {hasEst && <span style={{ fontSize: 11, color: "#f59e0b" }}>~est</span>}
              </div>
              {baliPending && (
                <div style={{ fontSize: 11, color: "#c96a2a", marginTop: 3 }}>+ Bali transport (pending)</div>
              )}
            </div>

            {/* Single */}
            <div style={{ borderTop: "1px solid #2e2925", paddingTop: 16 }}>
              <div style={{ fontSize: 11, color: "#7a6e65", marginBottom: 4 }}>Single Occupancy</div>
              <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                <span style={{ fontSize: 28, fontWeight: 800, color: "#c8c0b0", letterSpacing: "-0.02em" }}>
                  {fmt(singleTotal)}
                </span>
                {hasEst && <span style={{ fontSize: 11, color: "#f59e0b" }}>~est</span>}
              </div>
              {baliPending && (
                <div style={{ fontSize: 11, color: "#c96a2a", marginTop: 3 }}>+ Bali transport (pending)</div>
              )}
            </div>

            <div style={{ marginTop: 16, borderTop: "1px solid #2e2925", paddingTop: 14 }}>
              <div style={{ fontSize: 11, color: "#5a5048" }}>
                <strong style={{ color: "#7a6e65" }}>Single saves:</strong>{" "}
                <span style={{ color: "#f59e0b" }}>{fmt(singleTotal - doubleTotal)} extra</span> vs sharing
              </div>
            </div>
          </div>

          {/* Breakdown */}
          <div style={{ background: "#fff", borderRadius: 14, border: "1px solid #e8e0d4", padding: "18px 20px" }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#9a9088", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 14 }}>
              Cost Breakdown
            </div>
            <div style={{ fontSize: 11, color: "#b0a89a", display: "flex", justifyContent: "flex-end", marginBottom: 8, gap: 16 }}>
              <span>Single</span>
              <span style={{ minWidth: 55, textAlign: "right" }}>Sharing</span>
            </div>

            {rows.map((r, i) => (
              <div
                key={i}
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  padding: "6px 0",
                  borderBottom: i < rows.length - 1 ? "1px solid #f5f1eb" : "none",
                  opacity: r.pending ? 0.55 : 1,
                }}
              >
                <span style={{ fontSize: 12, color: "#4a4540", flex: 1, paddingRight: 8 }}>
                  {r.label}
                  {r.est && <span style={{ marginLeft: 5, background: "#fef3c7", color: "#b45309", fontSize: 9, padding: "1px 4px", borderRadius: 3, fontWeight: 700 }}>EST</span>}
                  {r.pending && <span style={{ marginLeft: 5, background: "#fef3c7", color: "#b45309", fontSize: 9, padding: "1px 4px", borderRadius: 3, fontWeight: 700 }}>PENDING</span>}
                </span>
                {r.single != null ? (
                  <span style={{ fontSize: 12, color: "#4a4540", fontWeight: 600, minWidth: 110, textAlign: "right" }}>
                    <span style={{ color: "#9a9088" }}>{fmt(r.single)}</span>
                    <span style={{ color: "#d0c8c0", margin: "0 3px" }}>/</span>
                    <span style={{ color: "#c96a2a" }}>{fmt(r.dbl)}</span>
                  </span>
                ) : (
                  <span style={{ fontSize: 12, fontWeight: 700, color: r.pending ? "#f59e0b" : "#1a1714", minWidth: 110, textAlign: "right" }}>
                    {r.pending ? "pending" : fmt(r.amount)}
                  </span>
                )}
              </div>
            ))}

            <div style={{ marginTop: 12, borderTop: "2px solid #1a1714", paddingTop: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 13, fontWeight: 800, color: "#1a1714" }}>Total</span>
              <span style={{ fontSize: 13, fontWeight: 800, color: "#1a1714" }}>
                <span style={{ color: "#9a9088" }}>{fmt(singleTotal)}</span>
                <span style={{ color: "#d0c8c0", margin: "0 5px" }}>/</span>
                <span style={{ color: "#c96a2a" }}>{fmt(doubleTotal)}</span>
              </span>
            </div>
          </div>

          {/* Notes */}
          <div style={{ marginTop: 10, fontSize: 11, color: "#9a9088", lineHeight: 1.6, padding: "0 4px" }}>
            All prices USD · Round-trip flights · Hotels per 5-night stay · Activities: full budgets from cost sheet · Meals, shopping & visa costs excluded
          </div>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TripCostCalculator />);
</script>
</body>
</html>
